replicaCount: 1
image:
  repository: ghcr.io/radicand/forwardauth-rs
  tag: 2.4.1
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: auth.example.test
      paths:
        - path: /
          pathType: Prefix
  tls: []
applicationYaml: {}
existingConfigMap: ''
existingSecret: ''
resources:
  limits:
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
env: []
