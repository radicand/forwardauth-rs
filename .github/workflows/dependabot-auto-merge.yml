name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name != 'check_run'
    steps:
      - name: Fetch PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            console.log(`PR #${pr.number}: ${pr.title}`);
            console.log(`Status: ${pr.state}`);
            return {
              number: pr.number,
              state: pr.state,
              draft: pr.draft,
              mergeable: pr.mergeable,
            };

      - name: Check if all checks passed
        id: check-status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
            });

            console.log(`Found ${checks.check_runs.length} checks`);
            
            const failedChecks = checks.check_runs.filter(check => check.conclusion !== 'success' && check.status === 'completed');
            const pendingChecks = checks.check_runs.filter(check => check.status !== 'completed');
            
            if (failedChecks.length > 0) {
              console.log('Failed checks:', failedChecks.map(c => c.name));
              core.setOutput('all-passed', 'false');
              return;
            }
            
            if (pendingChecks.length > 0) {
              console.log('Pending checks:', pendingChecks.map(c => c.name));
              core.setOutput('all-passed', 'false');
              return;
            }

            console.log('All checks passed!');
            core.setOutput('all-passed', 'true');

      - name: Enable auto-merge
        if: steps.check-status.outputs.all-passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (!pr.mergeable) {
              console.log('PR is not mergeable');
              return;
            }

            try {
              await github.rest.pulls.enableAutoMerge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                merge_method: 'squash',
              });
              console.log('✅ Auto-merge enabled');
            } catch (error) {
              // Auto-merge might already be enabled or not available
              console.log('Auto-merge status:', error.message);
            }

      - name: Merge PR (fallback)
        if: steps.check-status.outputs.all-passed == 'true'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (!pr.draft && pr.mergeable && pr.mergeable_state === 'clean') {
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  merge_method: 'squash',
                });
                console.log('✅ PR merged successfully');
              } catch (error) {
                console.log('Could not merge:', error.message);
              }
            } else {
              console.log('PR not ready for merge - Draft:', pr.draft, 'Mergeable:', pr.mergeable, 'State:', pr.mergeable_state);
            }
